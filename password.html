<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .password-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        .password-input {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 18px;
            padding: 10px 20px;
            border: 2px solid #000000;
            border-radius: 4px;
            text-align: center;
        }
        .password-error {
            color: #ff0000;
            font-size: 14px;
            display: none;
        }
        .password-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-link">home</a>

    <div class="password-container">
        <h2>enter password</h2>
        <input type="password" class="password-input" id="password-input" placeholder="password" autofocus>
        <div class="password-error" id="password-error">incorrect password</div>
    </div>

    <script>
        const passwordInput = document.getElementById('password-input');
        const passwordError = document.getElementById('password-error');

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const password = passwordInput.value.toLowerCase();
                if (password === 'axe') {
                    window.location.href = 'game.html';
                } else {
                    passwordError.classList.add('show');
                    passwordInput.value = '';
                    setTimeout(() => {
                        passwordError.classList.remove('show');
                    }, 2000);
                }
            }
        });
    </script>
</body>
</html>
